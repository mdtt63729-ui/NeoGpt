name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ---- signing material comes only from repository secrets ----
      - name: Restore release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Repository secret $name is missing. Run the 'Generate signing key' workflow and add the four secrets."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          cat > keystore.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          echo "keystore restored ($(stat -c%s release.jks) bytes)"

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify the release APK is signed
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signature.txt
          grep -q "CN=NeoGPT" signature.txt || { echo "::error::APK is not signed with the NeoGPT release key"; exit 1; }
          echo "### Signed APK" >> $GITHUB_STEP_SUMMARY
          head -8 signature.txt >> $GITHUB_STEP_SUMMARY

      - name: Name the artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/NeoGPT-$(grep -m1 versionName app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')-release.apk"
          cp app/build/outputs/apk/debug/*.apk dist/NeoGPT-debug.apk
          ls -l dist

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoGPT-release-apk
          path: dist/*-release.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoGPT-debug-apk
          path: dist/NeoGPT-debug.apk
          if-no-files-found: error

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: NeoGPT ${{ github.ref_name }}
          files: dist/*-release.apk
          generate_release_notes: true
          body: |
            Signed release build of NeoGPT, compiled and signed by GitHub Actions.

            - Package: `com.neogpt.client` · minSdk 26 (Android 8.0+) · targetSdk 35
            - Signed with the NeoGPT release keystore held in repository secrets
            - Debug APK (`com.neogpt.client.debug`) is on the run's artifacts

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
